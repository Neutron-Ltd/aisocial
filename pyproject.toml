[project]
name = "neutx"
version = "0.2.0"
description = "AI social media studio: generate with ComfyUI, schedule and publish to TikTok, Instagram, YouTube and X."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
