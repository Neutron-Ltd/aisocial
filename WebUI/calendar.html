<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEUTX — Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.62.0/dist/umd/lucide.min.js" integrity="sha384-KbBG+Cdzk6eN6IszNtkSQeU6IJq84TBpyLQN+W8Fn8y0QNsTNiB+j8vFW5Rn1SGZ" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="bridge.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        obsidian:  '#191919',
                        electric:  '#E5B96C',
                        goldlight: '#F9D98C',
                        golddeep:  '#D4A04B',
                        cloud:     '#F8FAFC',
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'blob-slow': 'blob 15s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            overflow: hidden;
        }

        /* Calendar Grid Specifics */
        .day-cell {
            min-height: 120px;
            transition: background-color 0.2s ease;
        }
        .day-cell.drag-over {
            background-color: rgba(229, 185, 108, 0.08);
            border: 1px dashed rgba(229, 185, 108, 0.5);
        }

        .draggable-post {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .draggable-post:active {
            cursor: grabbing;
        }
        .draggable-post.dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }
        .view-btn.active { background: rgba(229,185,108,.15); color: #E5B96C; border: 1px solid rgba(229,185,108,.2); }
        .view-btn:not(.active) { color: #9CA3AF; }
        #post-dialog[open] { display: block; }
    </style>
</head>
<body class="antialiased selection:bg-electric/40 selection:text-cloud h-screen flex">

    <!-- Aurora Background (Bridge UI) -->
    <div class="aurora-bg"></div>

    <div id="bridge-nav-backdrop" class="bridge-nav-backdrop fixed inset-0 z-[60] md:hidden" aria-hidden="true"></div>

    <!-- Sidebar (Desktop + mobile drawer) -->
    <aside id="bridge-sidebar" class="w-64 glass-panel border-r border-white/5 flex flex-col fixed inset-y-0 left-0 z-[70] h-full -translate-x-full transition-transform duration-200 ease-out shadow-2xl shadow-black/50 md:static md:inset-auto md:h-auto md:translate-x-0 md:shadow-none md:z-20">
        <div class="h-20 flex items-center px-6 border-b border-white/5">
            <div class="flex items-center gap-2.5 cursor-pointer w-fit" onclick="window.location.href='index.html'">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-electric to-goldlight flex items-center justify-center p-0.5 shadow-lg shadow-electric/30">
                    <div class="w-full h-full bg-obsidian rounded-[6px] flex items-center justify-center">
                        <i data-lucide="atom" class="w-[18px] h-[18px] text-electric"></i>
                    </div>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="text-base font-extrabold tracking-[0.18em] text-cloud">NEUTX</span>
                    <span class="font-mono text-[0.58rem] uppercase tracking-wider text-gray-500 mt-1">Neutron Text-to-X</span>
                </div>
            </div>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <p class="mono-label px-2 mb-2">Menu</p>
            
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 font-medium">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                Dashboard
            </a>
            
            <a href="studio.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 font-medium">
                <i data-lucide="wand-2" class="w-5 h-5"></i>
                Create Post
            </a>

            <!-- Highlighted to show active calendar state -->
            <a href="#" class="sidebar-link active flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium">
                <i data-lucide="calendar-days" class="w-5 h-5"></i>
                Calendar
            </a>
            
            <a href="template.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 font-medium">
                <i data-lucide="layout-template" class="w-5 h-5"></i>
                Templates
            </a>

            <a href="media.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 font-medium">
                <i data-lucide="folder-open" class="w-5 h-5"></i>
                Media Library
            </a>

            <p class="mono-label px-2 mt-8 mb-2">Account</p>
            
            <a href="connections.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 font-medium">
                <i data-lucide="link" class="w-5 h-5"></i>
                Connections
            </a>

            <a href="settings.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 font-medium">
                <i data-lucide="settings" class="w-5 h-5"></i>
                Settings
            </a>
        </nav>

        <!-- Sign out -->
        <div class="p-4 border-t border-white/5">
            <button type="button" data-action="sign-out" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-cloud text-sm font-semibold hover:bg-red-500/10 hover:border-red-500/30 hover:text-red-400 transition-colors group">
                <i data-lucide="log-out" class="w-4 h-4 transition-transform group-hover:translate-x-0.5"></i>
                Sign out
            </button>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col relative z-10 overflow-hidden">
        
        <!-- Top Header -->
        <header class="h-20 glass-panel border-b border-white/5 flex items-center justify-between px-6 lg:px-10 z-20 shrink-0">
            <div class="flex items-center gap-4">
                <button type="button" id="bridge-nav-toggle" class="md:hidden p-2 -ml-1 rounded-lg text-gray-400 hover:text-white hover:bg-white/5" aria-label="Open menu" aria-expanded="false" aria-controls="bridge-sidebar">
                    <i data-lucide="menu" class="w-6 h-6" aria-hidden="true"></i>
                </button>
                <div class="hidden sm:flex items-center gap-2 text-sm text-gray-400">
                    <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    <span class="text-electric font-mono uppercase tracking-wider text-xs">Content Calendar</span>
                </div>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-4 ml-auto">
                <button onclick="window.location.href='studio.html'" class="gold-cta hidden sm:flex items-center gap-2 px-5 py-2 rounded-full text-sm glow-elev">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    New Post
                </button>
                <button type="button" onclick="window.location.href='settings.html'" title="Account settings" class="flex items-center gap-2 p-1 pl-2 rounded-full border border-white/10 hover:bg-white/5 transition-colors">
                    <span data-user-name class="text-sm font-medium text-gray-300 hidden sm:block"></span>
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 to-orange-400 flex items-center justify-center text-white font-bold text-sm" data-user-initial></div>
                </button>
            </div>
        </header>

        <!-- Main Calendar Area -->
        <main class="flex-1 overflow-y-auto p-4 lg:p-8 relative flex flex-col">
            <div class="max-w-[1400px] mx-auto w-full flex-1 flex flex-col">
                
                <!-- Calendar Controls Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 shrink-0">
                    <div class="flex items-center gap-4">
                        <h1 id="cal-title" class="text-2xl sm:text-3xl font-bold text-white min-w-[10ch]"></h1>
                        <div class="flex gap-1">
                            <button type="button" id="cal-prev" aria-label="Previous" class="p-1.5 rounded-lg border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                                <i data-lucide="chevron-left" class="w-5 h-5"></i>
                            </button>
                            <button type="button" id="cal-next" aria-label="Next" class="p-1.5 rounded-lg border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 transition-colors">
                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <button type="button" id="cal-today" class="px-3 py-1.5 rounded-lg bg-white/5 border border-white/10 text-sm font-medium text-white hover:bg-white/10 transition-colors">
                            Today
                        </button>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="p-1 rounded-xl bg-black/50 border border-white/10 flex">
                            <button type="button" data-view="month" class="view-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-colors">Month</button>
                            <button type="button" data-view="week" class="view-btn px-4 py-1.5 rounded-lg text-sm font-medium transition-colors">Week</button>
                        </div>
                        <div class="relative">
                            <i data-lucide="filter" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none"></i>
                            <select id="cal-filter" aria-label="Filter by platform" class="bridge-input rounded-xl py-2 pl-9 pr-3 text-sm appearance-none cursor-pointer">
                                <option value="">All platforms</option>
                                <option value="tiktok">TikTok</option>
                                <option value="instagram">Instagram</option>
                                <option value="youtube">YouTube</option>
                                <option value="x">X</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="attention" class="hidden mb-6 shrink-0"></div>

                <!-- Calendar Grid Container -->
                <div class="glass-panel rounded-2xl border border-white/10 overflow-hidden flex-1 flex flex-col min-h-[600px]">
                    <div class="grid grid-cols-7 border-b border-white/10 bg-black/40 shrink-0" id="cal-weekdays"></div>
                    <div class="flex-1 overflow-y-auto">
                        <div class="grid grid-cols-7 h-full border-l border-t border-white/5" id="calendar-grid"></div>
                    </div>
                </div>

                <div class="mt-4 text-center text-sm text-gray-500 flex items-center justify-center gap-2">
                    <i data-lucide="mouse-pointer-click" class="w-4 h-4"></i>
                    Click a post to edit it. Drag scheduled posts to another day to reschedule them. Times are in <span id="tz-label"></span>.
                </div>
            </div>

            <!-- Post detail dialog -->
            <dialog id="post-dialog" class="bg-transparent p-0 m-auto w-full max-w-2xl backdrop:bg-black/70">
                <form id="post-form" method="dialog" class="glass-panel rounded-2xl border border-white/10 p-6 text-cloud max-h-[90vh] overflow-y-auto">
                    <div class="flex items-start justify-between gap-4 mb-5">
                        <div>
                            <h2 class="text-xl font-bold text-white" id="pd-title">Post</h2>
                            <div id="pd-status" class="mt-1"></div>
                        </div>
                        <button type="button" data-close class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-white/5" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-[180px_1fr] gap-5">
                        <div id="pd-media" class="rounded-xl overflow-hidden border border-white/10 bg-black aspect-[9/16] sm:aspect-auto sm:h-64"></div>
                        <div class="space-y-4">
                            <div>
                                <label for="pd-caption" class="block text-xs font-semibold text-gray-400 mb-1.5">Caption</label>
                                <textarea id="pd-caption" rows="4" maxlength="5000" class="w-full bridge-input rounded-xl p-3 text-sm resize-none"></textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label for="pd-date" class="block text-xs font-semibold text-gray-400 mb-1.5">Date</label>
                                    <input id="pd-date" type="date" class="w-full bridge-input rounded-xl p-2.5 text-sm" style="color-scheme: dark;">
                                </div>
                                <div>
                                    <label for="pd-time" class="block text-xs font-semibold text-gray-400 mb-1.5">Time</label>
                                    <input id="pd-time" type="time" class="w-full bridge-input rounded-xl p-2.5 text-sm" style="color-scheme: dark;">
                                </div>
                            </div>
                        </div>
                    </div>
                    <h3 class="mono-label mt-6 mb-3">Destinations</h3>
                    <div id="pd-targets" class="space-y-2"></div>
                    <div class="mt-6 flex flex-wrap justify-end gap-3" id="pd-actions"></div>
                </form>
            </dialog>
        </main>
    </div>

    <!-- Mobile Navigation Bar (Bottom) - Consistent with Dashboard -->
    <div class="md:hidden fixed bottom-0 left-0 w-full glass-panel border-t border-white/10 z-50 px-6 py-3 flex justify-between items-center pb-safe">
        <a href="dashboard.html" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center text-electric gap-1">
            <i data-lucide="calendar-days" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Schedule</span>
        </a>
        <!-- Floating FAB for Mobile -->
        <div class="relative -top-5" onclick="window.location.href='studio.html'">
            <button class="gold-cta w-12 h-12 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(229,185,108,0.45)] border-4 border-[#0F0F0F]">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
        </div>
        <a href="template.html" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
            <i data-lucide="layout-template" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Templates</span>
        </a>
        <a href="settings.html" class="flex flex-col items-center text-gray-400 hover:text-white gap-1">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="text-[10px] font-medium">Settings</span>
        </a>
    </div>

    <script src="app.js"></script>

    <script src="bridge.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
